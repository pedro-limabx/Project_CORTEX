services:
  postgres:
    image: postgres:17-alpine
    container_name: cortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex
    ports:
      - "5432:5432"
    volumes:
      - cortex_pgdata:/var/lib/postgresql/data
volumes:
  cortex_pgdata:
