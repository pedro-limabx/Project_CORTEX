name: CORTEX checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cortex_test
          POSTGRES_PASSWORD: cortex_test
          POSTGRES_DB: cortex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cortex_test -d cortex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cortex_test:cortex_test@localhost:5432/cortex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-fund
      - name: Audit all dependencies
        run: npm audit --audit-level=moderate
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (with PostgreSQL)
        run: npm test
      - name: Build
        run: npm run build
