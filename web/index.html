<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CORTEX — NEURON</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#0b0d10;color:#f5f7fa}main{max-width:900px;margin:auto;padding:48px 20px}.card{background:#151922;border:1px solid #272d38;border-radius:16px;padding:24px}h1{margin:0 0 8px}.muted{color:#9da6b5}#chat{min-height:320px;white-space:pre-wrap;border:1px solid #272d38;border-radius:12px;padding:16px;margin:16px 0;overflow:auto}form{display:flex;gap:10px}input{flex:1;background:#0e1117;color:#fff;border:1px solid #303746;border-radius:10px;padding:13px}button{background:#f5f7fa;color:#0b0d10;border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer}</style></head><body><main><div class="card"><h1>CORTEX / NEURON</h1><p class="muted">Interface experimental v0.1</p><div id="chat"></div><form id="form"><input id="message" placeholder="Fale com a NEURON..." autocomplete="off"><button>Enviar</button></form></div></main><script>const chat=document.querySelector("#chat"),form=document.querySelector("#form"),input=document.querySelector("#message");function add(a,b){chat.textContent+=a+": "+b+"\n\n";chat.scrollTop=chat.scrollHeight}form.addEventListener("submit",async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;input.value="";add("VOCÊ",message);try{const r=await fetch("http://127.0.0.1:3000/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userId:"local-user",message})});const d=await r.json();add("NEURON",d.text||d.error||"Erro")}catch{add("SISTEMA","Não foi possível conectar à NEURON.")}});</script></body></html>
